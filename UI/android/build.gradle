// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project(':capacitor-local-notifications') {
    def repeatIdlePatch = rootProject.file('patches/local-notifications-repeat-idle.patch')
    def pluginDir = projectDir
    def patchLocalNotifications = tasks.register('patchLocalNotifications') {
        doLast {
            // Capacitor 8.3.1 drops allowWhileIdle when re-arming a calendar notification.
            def gitApply = { List<String> flags ->
                providers.exec {
                    workingDir pluginDir
                    environment 'GIT_CEILING_DIRECTORIES', pluginDir.parentFile.absolutePath
                    commandLine(['git', 'apply', '--ignore-space-change'] + flags + [repeatIdlePatch.absolutePath])
                    ignoreExitValue = true
                }
            }
            if (gitApply(['--reverse', '--check']).result.get().exitValue != 0) {
                def applyResult = gitApply([])
                if (applyResult.result.get().exitValue != 0) {
                    throw new GradleException("Cannot apply ${repeatIdlePatch.name}: ${applyResult.standardError.asText.get()}")
                }
            }
        }
    }
    tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn patchLocalNotifications }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
